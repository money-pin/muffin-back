spring:
  application:
    name: muffin
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

toss:
  api:
    base-url: ${TOSS_API_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${TOSS_CLIENT_ID}
    client-secret: ${TOSS_CLIENT_SECRET}
