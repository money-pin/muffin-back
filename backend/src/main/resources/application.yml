spring:
  application:
    name: muffin
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

muffin:
  batch:
    settlement:
      # ETF 시세 적재 완료 이벤트가 1차 트리거. 아래 스케줄러는 이벤트가 아직 연동되지 않은 경우를 위한 안전망이며 멱등하다.
      scheduler-enabled: true
      cron: "0 30 9 * * *" # 매일 09:30, 결과 노출(10:00)보다 앞서 미리 정산
      zone: Asia/Seoul
  auth:
    email-verification:
      code-length: 6
      expire-minutes: 5
      resend-cooldown-seconds: 30
      max-attempts: 5
      max-daily-resend-count: 10
      cleanup-cron: "0 0 * * * *" # 매시 정각, 만료된 인증 레코드 정리
      zone: Asia/Seoul
