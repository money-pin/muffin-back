spring:
  application:
    name: muffin
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db
    baseline-on-migrate: false

springdoc:
  swagger-ui:


toss:
  api:
    base-url: ${TOSS_API_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${TOSS_CLIENT_ID}
    client-secret: ${TOSS_CLIENT_SECRET}

coingecko:
  api:
    base-url: ${COINGECKO_API_BASE_URL:https://api.coingecko.com}
    api-key: ${COINGECKO_API_KEY}

muffin:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://muffin-front.vercel.app}

  batch:
    rss:
      # rss 뉴스피드 수집 스케쥴러
      scheduler-enabled: ${NEWS_RSS_ENABLED:true}
      cron: ${NEWS_RSS_CRON:0 0 6 * * *}
      zone: ${NEWS_RSS_ZONE:Asia/Seoul}

    news-publication:
      scheduler-enabled: ${NEWS_PUBLICATION_ENABLED:true}
      cron: ${NEWS_PUBLICATION_CRON:0 0 9 * * *}
      zone: ${NEWS_PUBLICATION_ZONE:Asia/Seoul}

    quiz-publication:
      scheduler-enabled: ${QUIZ_PUBLICATION_ENABLED:true}
      cron: ${QUIZ_PUBLICATION_CRON:0 0 9 * * *}
      zone: ${QUIZ_PUBLICATION_ZONE:Asia/Seoul}

    quiz-generation-retry:
      # 뉴스 재구성 완료 이벤트 기반 생성이 실패하거나 누락된 경우를 위한 발행 전 재시도 안전망
      scheduler-enabled: ${QUIZ_GENERATION_RETRY_ENABLED:true}
      cron: ${QUIZ_GENERATION_RETRY_CRON:0 */10 6-8 * * *}
      zone: ${QUIZ_GENERATION_RETRY_ZONE:Asia/Seoul}

    settlement:
      # ETF 시세 적재 완료 이벤트가 1차 트리거.
      # 아래 스케줄러는 이벤트가 아직 연동되지 않은 경우를 위한 안전망이며 멱등하다.
      scheduler-enabled: true
      cron: "0 35 9 * * *"
      zone: Asia/Seoul

    open-price:
      scheduler-enabled: true
      collection-cron: "0 0-15/5 9 * * *"
      finalization-cron: "0 20 9 * * *"
      zone: Asia/Seoul

    close-price:
      scheduler-enabled: true
      afternoon-cron: "0 35,45,55 15 * * *"
      final-cron: "0 5 16 * * *"
      zone: Asia/Seoul

    investment-finalization:
      scheduler-enabled: true
      cron: "0 0/10 0-8 * * *"
      zone: Asia/Seoul

  auth:
    email-verification:
      code-length: 6
      expire-minutes: 5
      resend-cooldown-seconds: 30
      max-attempts: 5
      max-daily-resend-count: 10
      cleanup-cron: "0 0 * * * *" # 매시 정각, 만료된 인증 레코드 정리
      zone: Asia/Seoul

    jwt:
      secret: ${JWT_SECRET}
      access-token-expire-minutes: 60
      refresh-token-expire-days: 30

    google:
      client-id: ${GOOGLE_CLIENT_ID}

    login:
      max-attempts: 5
      lock-minutes: 30

    signup:
      unverified-account-cleanup:
        ttl-minutes: 1440 # 24시간
        cleanup-cron: "0 0 * * * *" # 매시 정각
        zone: Asia/Seoul

    withdrawal:
      data-cleanup:
        retention-months: 6
        cleanup-cron: "0 0 3 * * *" # 매일 새벽 3시
        zone: Asia/Seoul

    deleted-email:
      hash-secret: ${DELETED_EMAIL_HASH_SECRET}

  news:
    rss:
      publisher: ${NEWS_RSS_PUBLISHER:매일경제}
      feeds:
        - category: 경제
          url: ${NEWS_RSS_ECONOMY_URL:https://www.mk.co.kr/rss/30100041/}
        - category: 증권
          url: ${NEWS_RSS_STOCK_URL:https://www.mk.co.kr/rss/50200011/}
        - category: 세계
          url: ${NEWS_RSS_WORLD_URL:https://www.mk.co.kr/rss/30300018/}

    ai:
      # AI 기반 기능의 활성화 여부 (비활성화 시 관련 AI 컴포넌트를 등록하지 않음)
      enabled: ${NEWS_AI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      endpoint: ${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}

      ai-selection:
        model: ${NEWS_AI_SELECTION_MODEL:gpt-5-mini}
        max-per-category: ${NEWS_AI_SELECTION_MAX_PER_CATEGORY:5}

      reconstruction:
        model: ${NEWS_RECONSTRUCTION_MODEL:gpt-4o}
        max-source-length: ${NEWS_RECONSTRUCTION_MAX_SOURCE_LENGTH:20000}

      explanation:
        model: ${NEWS_EXPLANATION_MODEL:gpt-4o}

      quiz:
        model: ${QUIZ_GENERATION_MODEL:gpt-4o}

# 배치 관측용 지표 노출. 외부에는 열지 않는다: EC2 보안그룹이 80/443만 허용해
# 8080 직접 접근이 불가능하고, Nginx에서 /actuator를 차단한다(인프라 PR).
management:
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. 기본값(health)에 prometheus만 더한다.
        include: health,prometheus
  endpoint:
    health:
      # 외부에 DB/디스크 상태 상세를 흘리지 않는다.
      show-details: never
  metrics:
    tags:
      application: muffin
    distribution:
      # 백분위 히스토그램은 켜지 않는다. 엔드포인트마다 버킷이 수십 개씩 붙어
      # 활성 시계열이 한 자릿수 배로 늘고, 수집 한도를 넘기면 배치 알림까지 멈춘다.
      # 대신 자주 보는 지연대에만 경계를 두어 p95를 근사하고 "1초 초과 비율"은 정확히 얻는다.
      percentiles-histogram:
        http.server.requests: false
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 300ms, 500ms, 1s, 2s
