spring:
  application:
    name: muffin
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

toss:
  api:
    base-url: ${TOSS_API_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${TOSS_CLIENT_ID}
    client-secret: ${TOSS_CLIENT_SECRET}

muffin:
  batch:
    settlement:
      # ETF 시세 적재 완료 이벤트가 1차 트리거. 아래 스케줄러는 이벤트가 아직 연동되지 않은 경우를 위한 안전망이며 멱등하다.
      scheduler-enabled: true
      cron: "0 30 9 * * *" # 매일 09:30, 결과 노출(10:00)보다 앞서 미리 정산
      zone: Asia/Seoul
