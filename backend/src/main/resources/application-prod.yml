server:
  # Nginx 리버스 프록시 뒤에 위치하므로 X-Forwarded-* 헤더를 신뢰해 원본 스킴(https)/호스트를 인식한다.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

muffin:
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}

logging:
  # 운영 로그는 JSON 한 줄로 남긴다. Grafana(Loki)에서 level/domain 같은 필드 단위로 걸러 보려면
  # 사람이 읽는 평문이 아니라 구조화 포맷이어야 한다. 로컬은 기본 콘솔 포맷을 그대로 쓴다.
  structured:
    format:
      console: logstash
    json:
      customizer: com.muffin.global.logging.DomainJsonMembersCustomizer
  level:
    root: info
