server:
  # Nginx 리버스 프록시 뒤에 위치하므로 X-Forwarded-* 헤더를 신뢰해 원본 스킴(https)/호스트를 인식한다.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

muffin:
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    root: info
