spring:
  datasource:
    url: jdbc:mysql://localhost:3306/muffin?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    # MVP 개발 중에는 로컬 스키마를 Hibernate(ddl-auto: update)가 관리한다.
    # 마이그레이션 파일(V1__init.sql)은 첫 배포 전에 1회 생성한다.
    # 운영 적용 이후의 스키마 변경은 기존 파일을 수정하지 않고 V2__, V3__ 새 버전으로 누적한다.
    enabled: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

toss:
  api:
    base-url: ${TOSS_API_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}

muffin:
  auth:
    jwt:
      # 로컬 개발 전용 더미 시크릿
      secret: ${JWT_SECRET:local-dev-only-jwt-secret-please-change-1234567890}

    google:
      client-id: ${GOOGLE_CLIENT_ID:}

coingecko:
  api:
    api-key: ${COINGECKO_API_KEY:}
