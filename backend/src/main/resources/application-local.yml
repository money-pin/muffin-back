spring:
  datasource:
    url: jdbc:mysql://localhost:3306/muffin?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 로컬도 운영과 동일하게 Flyway가 스키마를 관리하고 Hibernate는 검증만 한다.
      # 이렇게 해야 마이그레이션 파일과 엔티티의 불일치(drift)를 배포 전에 로컬에서 바로 발견할 수 있다.
      ddl-auto: validate
    show-sql: true
  flyway:
    # 스키마 변경 방법:
    #  - 첫 운영 배포 "전"(현재): V1__init.sql을 재생성해도 된다.
    #    scripts/generate-flyway-baseline.sh --force 실행 후, 팀원 전원 로컬 DB drop 후 재기동 (공지 필수)
    #  - 첫 운영 배포 "후": 기존 파일은 절대 수정하지 않고 V2__, V3__ 새 버전 파일로만 누적한다.
    #    (Flyway가 체크섬을 저장하므로 기존 파일을 고치면 배포가 깨진다)
    enabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

toss:
  api:
    base-url: ${TOSS_API_BASE_URL:https://openapi.tossinvest.com}
    client-id: ${TOSS_CLIENT_ID:}
    client-secret: ${TOSS_CLIENT_SECRET:}

muffin:
  auth:
    jwt:
      # 로컬 개발 전용 더미 시크릿
      secret: ${JWT_SECRET:local-dev-only-jwt-secret-please-change-1234567890}

    google:
      client-id: ${GOOGLE_CLIENT_ID:}

    deleted-email:
      # 로컬 개발 전용 더미 시크릿
      hash-secret: ${DELETED_EMAIL_HASH_SECRET:local-dev-only-deleted-email-hash-secret-please-change}

coingecko:
  api:
    api-key: ${COINGECKO_API_KEY:}
