# 테스트 전용 설정 - 외부 DB 없이 인메모리 H2 사용
spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

toss:
  api:
    base-url: https://toss-api.test
    client-id: test-client-id
    client-secret: test-client-secret

muffin:
  auth:
    jwt:
      secret: test-jwt-secret-key-for-automated-tests-only-32bytes-minimum
      access-token-expire-minutes: 60
      refresh-token-expire-days: 30

    login:
      max-attempts: 5
      lock-minutes: 30

  news:
    ai-selection:
      enabled: false
