# Grafana 알림 룰 (Prometheus 규칙 파일 문법)
#
# 자동 반영되지 않는다. Grafana에 직접 올려야 알림이 된다.
#
#   Alerting → Alert rules → Import alert rules → "Prometheus YAML file"
#   → 이 파일 업로드 → 대상 폴더 Muffin (대문자 M) → Import
#
# 올린 뒤 반드시 한 곳을 손본다. importer가 모든 룰의 "데이터 없음" 상태를
# Normal로 넣는데, "앱을 긁을 수 없음"만 Alerting이어야 한다.
#
#   앱을 긁을 수 없음 → Configure no data and error handling
#   → Alert state if no data or all values are null: Alerting
#
# 이 룰의 up{job="muffin-backend"}는 Alloy가 살아서 "못 긁었다"고 보고해 줄 때만
# 0이 된다. Alloy나 EC2가 통째로 죽으면 값이 0인 게 아니라 아예 없다. Normal로 두면
# 그 상황에서 화면이 초록으로 남고 알림이 오지 않는다. 관측이 죽었는데 아무도 모르는
# 구멍이 정확히 여기다. 나머지 5개는 그때 이 룰이 대신 울려주므로 Normal이 맞다.
#
# 문법을 Grafana 프로비저닝 형식이 아니라 Prometheus 형식으로 쓴 이유:
# Grafana Cloud는 프로비저닝 파일을 올릴 경로가 없다(파일시스템 접근 불가, 재시작 불가).
# UI import는 Prometheus 형식만 받고, 그 외에는 서비스 계정 토큰을 만들어 프로비저닝
# API를 호출하는 방법뿐이라 한 번 하고 마는 작업에 비해 관리 비용이 크다.
# 임계 판정이 별도 노드가 아니라 expr 안의 비교 연산으로 들어간 것이 유일한 구조 차이다.
#
# 설계 원칙 하나: 룰은 "사람이 지금 움직여야 하는 것"만 만든다. 봐두면 좋은 값은
# 대시보드에 두고 알림으로 만들지 않는다. 울려도 아무도 안 하는 알림이 하나 생기면
# 그 다음부터 모든 알림이 무시된다.

groups:
  # ---------------------------------------------------------------------------
  # 배치: 이 서비스의 1순위 장애다. 정산이 안 돌면 사용자 자산이 그냥 갱신되지 않는데,
  # 화면 어디에도 "안 돌았다"고 나오지 않는다. 침묵을 신호로 바꾸는 게 이 그룹의 일이다.
  # ---------------------------------------------------------------------------
  - name: 배치
    interval: 5m
    rules:
      # 쿼리 한 줄이 두 가지 상황을 함께 답한다.
      #
      #   왼쪽(or 앞): 마지막 성공 이후 흐른 시간. 평상시 경로다.
      #   오른쪽:      한 번도 성공한 적 없는 잡에 대해, 앱이 뜬 뒤 흐른 시간.
      #
      # 오른쪽이 필요한 이유: 게이지는 인메모리라 재기동하면 0으로 돌아간다. 왼쪽만
      # 쓰면서 오탐을 막으려고 "> 0"으로 거르면, 재기동 후 첫 실행 전까지 그 잡이
      # 통째로 무감시 상태가 된다. 배포 직후가 가장 위험한 구간인데 거기서 알림이
      # 꺼지는 셈이다. 오른쪽 항이 그 구멍을 메운다. 이미 성공한 잡은 곱셈 결과가
      # 0이라 임계값에 걸리지 않고, or는 같은 라벨 조합에서 왼쪽을 우선하므로
      # 두 항이 겹쳐 중복 발화하지도 않는다.
      #
      # batch_job!="" 이 필요한 이유: PromQL에서 없는 라벨은 빈 문자열이고, 빈 문자열은
      # 부정 정규식에 걸리지 않는다. 이 매처가 없으면 batch_job 라벨이 아예 없는
      # 시계열(구 버전 앱이 job= 으로 내보내던 것)까지 통과한다.
      #
      # 26시간(93600초)인 이유: 하루 주기 잡이 조금 밀려도 오탐하지 않게 하는 여유다.
      # 휴장일은 애초에 문제가 안 된다. 휴장은 SKIPPED(정상 종료)라 성공 시각을
      # 갱신하고, 선행 조건이 안 갖춰져 못 한 것만 DEFERRED로 갱신하지 않는다.
      - alert: 배치 잡이 26시간 넘게 성공하지 않음
        expr: >-
          (
            (
              (time() - muffin_batch_job_last_success_timestamp_seconds{batch_job!="",batch_job!~"email_verification_cleanup|unverified_account_cleanup"})
              and muffin_batch_job_last_success_timestamp_seconds{batch_job!="",batch_job!~"email_verification_cleanup|unverified_account_cleanup"} > 0
            )
            or
            (
              (time() - process_start_time_seconds{application="muffin"})
              * on(instance, job) group_right()
              (muffin_batch_job_last_success_timestamp_seconds{batch_job!="",batch_job!~"email_verification_cleanup|unverified_account_cleanup"} == bool 0)
            )
          ) > 93600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.batch_job }} 잡이 26시간 넘게 성공하지 않았습니다'
          description: >-
            Muffin / 배치 대시보드에서 해당 잡의 정확한 경과 시간과 실행 추이, 로그를 확인하세요.
            로그는 {service="muffin"} |= "batch job=" 로 조회합니다.
            경과가 앱 가동 시간과 비슷하면 재기동 후 아직 한 번도 돌지 않은 것이므로,
            그 잡의 다음 실행 시각이 지났는지부터 확인하세요.

      # 매시 정각에 도는 잡 2개. 일간 기준(26시간)을 그대로 쓰면 하루를 통째로
      # 놓치므로 따로 둔다. 쿼리 구조는 위 룰과 같다.
      - alert: 매시 정리 잡이 3시간 넘게 성공하지 않음
        expr: >-
          (
            (
              (time() - muffin_batch_job_last_success_timestamp_seconds{batch_job=~"email_verification_cleanup|unverified_account_cleanup"})
              and muffin_batch_job_last_success_timestamp_seconds{batch_job=~"email_verification_cleanup|unverified_account_cleanup"} > 0
            )
            or
            (
              (time() - process_start_time_seconds{application="muffin"})
              * on(instance, job) group_right()
              (muffin_batch_job_last_success_timestamp_seconds{batch_job=~"email_verification_cleanup|unverified_account_cleanup"} == bool 0)
            )
          ) > 10800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.batch_job }} 잡이 3시간 넘게 성공하지 않았습니다'
          description: 매시 정각에 도는 정리 잡입니다. 스케줄러가 죽었는지 확인하세요.

  # ---------------------------------------------------------------------------
  # 가용성: 관측 대상이 살아 있는가. 여기가 울리면 위쪽 배치 알림은 볼 필요가 없다.
  # ---------------------------------------------------------------------------
  - name: 가용성
    interval: 1m
    rules:
      # 배포 중에는 이전 컨테이너를 멈추고 새로 띄우는 사이 잠깐 실패한다.
      # for: 5m이 그 구간을 삼킨다. 5분을 넘겼다면 배포가 실패한 것이다.
      # 이 룰만 "데이터 없음"을 Alerting으로 둔다(맨 위 주석 참고).
      - alert: 앱을 긁을 수 없음
        expr: up{job="muffin-backend"} < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 앱 지표 수집이 5분 넘게 끊겼습니다
          description: >-
            앱이 죽었거나, 온박스 Alloy가 죽었거나, EC2가 내려간 것입니다.
            배포 직후라면 CD 로그를 먼저 확인하세요.

      # mysqld-exporter는 RDS 연결이 끊겨도 자기 go_ 지표로 HTTP 200을 준다.
      # 끊김을 알 수 있는 건 이 값뿐이다.
      - alert: DB에 연결할 수 없음
        expr: mysql_up < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 지표 수집 계정이 RDS에 붙지 못하고 있습니다
          description: >-
            앱도 못 붙는 상태인지 서비스로 확인하세요. 수집 계정만 막힌 것이라면
            MAX_USER_CONNECTIONS(3) 소진이나 계정 문제입니다.

  # ---------------------------------------------------------------------------
  # 자원: 지금 당장은 아니지만 두면 반드시 터지는 것들. 서서히 줄어드는 자원만 넣는다.
  # ---------------------------------------------------------------------------
  - name: 자원
    interval: 5m
    rules:
      # 도커 이미지가 쌓이며 줄어든다. 다 차면 배포가 실패하는데, 그 시점에는
      # 이미 늦어서 급하게 정리해야 한다. 3GB(3221225472)에서 미리 알린다.
      - alert: EC2 디스크 여유 부족
        expr: node_filesystem_avail_bytes{mountpoint="/"} < 3221225472
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: EC2 루트 디스크 여유가 3GB 아래로 내려갔습니다
          description: >-
            docker image prune -a 로 쓰지 않는 이미지를 정리하세요.
            남은 용량은 Muffin / API·앱 대시보드의 호스트 디스크 여유 패널에서 봅니다.

      # db.t3.micro는 1GB뿐이다. 여유가 줄면 버퍼풀 히트율이 떨어지고 모든 쿼리가
      # 느려진다. 앱이 아니라 DB가 원인인 지연을 여기서 먼저 안다. 150MB(157286400).
      - alert: RDS 여유 메모리 부족
        expr: aws_rds_freeable_memory_average < 157286400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: RDS 여유 메모리가 150MB 아래로 내려갔습니다
          description: >-
            performance_schema를 켜지 않은 이유가 이 여유가 크지 않기 때문입니다.
            현재 값은 Muffin / DB 대시보드의 RDS 여유 메모리 패널에서 봅니다.
