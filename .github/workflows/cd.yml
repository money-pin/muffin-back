name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 재배포용

# 배포가 겹치지 않도록 직렬화 (진행 중인 배포는 끝까지 두고 대기)
concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  CONTAINER_NAME: muffin
  # 앱 시크릿을 보관하는 SSM Parameter Store 경로
  SSM_PATH: /muffin/prod

permissions:
  id-token: write # OIDC 토큰 발급 (AWS 역할 assume에 필요)
  contents: read

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: ./gradlew clean bootJar

      # 액세스키 없이 OIDC로 단기 자격증명을 받는다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Deploy to EC2 over SSH
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          install -m 600 /dev/null deploy_key
          echo "${{ secrets.EC2_SSH_KEY }}" > deploy_key

          # 네트워크/원격 행(hang)으로 잡이 무한 대기하지 않도록 연결·세션·전체 실행에 상한을 둔다.
          timeout 900 ssh -i deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=8 \
              ec2-user@${{ secrets.EC2_HOST }} \
              "IMAGE='$REGISTRY/$REPOSITORY:$TAG' \
               REGISTRY='$REGISTRY' \
               REGION='${{ env.AWS_REGION }}' \
               NAME='${{ env.CONTAINER_NAME }}' \
               SSM_PATH='${{ env.SSM_PATH }}' \
               bash -s" <<'REMOTE'
          set -euo pipefail

          # EC2의 IAM Role로 ECR 인증 (서버에 저장된 비밀번호 없음)
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE"

          # 앱 시크릿을 SSM에서 조회한다. 평문 파일을 디스크에 남기지 않도록
          # tmpfs(/dev/shm)에 임시로 쓰고 컨테이너 기동 후 즉시 삭제한다.
          ENV_FILE="$(mktemp /dev/shm/muffin-env.XXXXXX)"
          chmod 600 "$ENV_FILE"
          trap 'rm -f "$ENV_FILE"' EXIT

          aws ssm get-parameters-by-path \
            --path "$SSM_PATH" \
            --recursive \
            --with-decryption \
            --region "$REGION" \
            --query "Parameters[].[Name,Value]" \
            --output text \
          | while IFS=$'\t' read -r pname pvalue; do
              printf '%s=%s\n' "${pname##*/}" "$pvalue"
            done > "$ENV_FILE"

          if [ ! -s "$ENV_FILE" ]; then
            echo "ERROR: $SSM_PATH 에서 파라미터를 하나도 읽지 못했습니다." >&2
            exit 1
          fi

          # 이전 컨테이너는 지우지 않고 옆으로 밀어둔다. 새 컨테이너 검증에 실패하면
          # 이걸 되살려 롤백한다(검증 성공 후에만 삭제).
          PREV="${NAME}-prev"
          docker rm -f "$PREV" 2>/dev/null || true
          if docker inspect "$NAME" >/dev/null 2>&1; then
            docker rename "$NAME" "$PREV"
            docker stop "$PREV" >/dev/null 2>&1 || true
          fi

          rollback() {
            docker rm -f "$NAME" 2>/dev/null || true
            if docker inspect "$PREV" >/dev/null 2>&1; then
              docker rename "$PREV" "$NAME"
              docker start "$NAME" >/dev/null 2>&1 || true
            fi
          }

          docker run -d \
            --name "$NAME" \
            --restart unless-stopped \
            -p 8080:8080 \
            --env-file "$ENV_FILE" \
            --log-opt max-size=10m --log-opt max-file=3 \
            "$IMAGE"

          # 유한 시간 내 기동 확인. 앱에 actuator가 없으므로 "컨테이너가 계속 running이고
          # 8080이 HTTP 응답을 준다"를 기준으로 판정한다(상태코드는 무관 — 응답 자체가 중요).
          deadline=$((SECONDS + 180))
          healthy=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$NAME" 2>/dev/null)" != "true" ]; then
              echo "ERROR: 새 컨테이너가 기동 중 종료되었습니다." >&2
              break
            fi
            if curl -sS -o /dev/null --max-time 5 http://127.0.0.1:8080/ 2>/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done

          if [ "$healthy" -ne 1 ]; then
            echo "ERROR: 제한 시간 내에 새 컨테이너가 응답하지 않아 롤백합니다." >&2
            docker logs --tail 100 "$NAME" 2>&1 || true
            rollback
            exit 1
          fi

          # 검증 성공 → 이전 컨테이너 정리
          docker rm -f "$PREV" 2>/dev/null || true

          # 디스크가 작으므로(20GB) 오래된 이미지 정리
          docker image prune -af --filter "until=168h"
          REMOTE

      - name: Remove deploy key
        if: always()
        run: rm -f deploy_key
