name: CD

on:
  push:
    branches: [dev]
  workflow_dispatch: # 수동 재배포용

# 배포가 겹치지 않도록 직렬화 (진행 중인 배포는 끝까지 두고 대기)
concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  CONTAINER_NAME: muffin
  # 앱 시크릿을 보관하는 SSM Parameter Store 경로
  SSM_PATH: /muffin/dev

permissions:
  id-token: write # OIDC 토큰 발급 (AWS 역할 assume에 필요)
  contents: read

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: ./gradlew clean bootJar

      # 액세스키 없이 OIDC로 단기 자격증명을 받는다.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Deploy to EC2 via SSM Run Command
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 대상 인스턴스는 Name 태그로 조회한다 (SSH host/키 시크릿 불필요).
          INSTANCE_IDS=($(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${CONTAINER_NAME}-backend" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text --region "$AWS_REGION"))
          if [ "${#INSTANCE_IDS[@]}" -ne 1 ] || [ "${INSTANCE_IDS[0]}" = "None" ]; then
            echo "ERROR: 실행 중인 대상 인스턴스(${CONTAINER_NAME}-backend)가 정확히 1개여야 합니다. found=${#INSTANCE_IDS[@]}" >&2
            exit 1
          fi
          INSTANCE_ID="${INSTANCE_IDS[0]}"
          echo "Target instance: $INSTANCE_ID"

          # EC2에서 실행할 배포 스크립트를 만든다. 러너에서 주입할 값(REGISTRY/TAG 등)은
          # 헤더(치환됨)에, 인스턴스에서 평가돼야 하는 변수($NAME 등)는 본문('REMOTE', 미치환)에 둔다.
          cat > deploy.sh <<HEADER
          IMAGE='$REGISTRY/$REPOSITORY:$TAG'
          REGISTRY='$REGISTRY'
          REGION='$AWS_REGION'
          NAME='$CONTAINER_NAME'
          SSM_PATH='$SSM_PATH'
          HEADER
          cat >> deploy.sh <<'REMOTE'
          set -euo pipefail

          # EC2의 IAM Role로 ECR 인증 (서버에 저장된 비밀번호 없음)
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          docker pull "$IMAGE"

          # 앱 시크릿을 SSM에서 조회한다. 평문 파일을 디스크에 남기지 않도록
          # tmpfs(/dev/shm)에 임시로 쓰고 컨테이너 기동 후 즉시 삭제한다.
          ENV_FILE="$(mktemp /dev/shm/muffin-env.XXXXXX)"
          chmod 600 "$ENV_FILE"
          trap 'rm -f "$ENV_FILE"' EXIT

          aws ssm get-parameters-by-path \
            --path "$SSM_PATH" \
            --recursive \
            --with-decryption \
            --region "$REGION" \
            --query "Parameters[].[Name,Value]" \
            --output text \
          | while IFS=$'\t' read -r pname pvalue; do
              printf '%s=%s\n' "${pname##*/}" "$pvalue"
            done > "$ENV_FILE"

          if [ ! -s "$ENV_FILE" ]; then
            echo "ERROR: $SSM_PATH 에서 파라미터를 하나도 읽지 못했습니다." >&2
            exit 1
          fi

          # 이전 컨테이너는 지우지 않고 옆으로 밀어둔다. 새 컨테이너 검증에 실패하면
          # 이걸 되살려 롤백한다(검증 성공 후에만 삭제).
          PREV="${NAME}-prev"
          docker rm -f "$PREV" 2>/dev/null || true
          if docker inspect "$NAME" >/dev/null 2>&1; then
            docker rename "$NAME" "$PREV"
            docker stop "$PREV" >/dev/null 2>&1 || true
          fi

          rollback() {
            docker rm -f "$NAME" 2>/dev/null || true
            if docker inspect "$PREV" >/dev/null 2>&1; then
              docker rename "$PREV" "$NAME"
              docker start "$NAME" >/dev/null 2>&1 || true
            fi
          }

          if ! docker run -d \
              --name "$NAME" \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file "$ENV_FILE" \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$IMAGE"; then
            echo "ERROR: 새 컨테이너 생성에 실패해 이전 컨테이너로 롤백합니다." >&2
            rollback
            exit 1
          fi

          # 유한 시간 내 기동 확인. 앱에 actuator가 없으므로 "컨테이너가 계속 running이고
          # 8080이 HTTP 응답을 준다"를 기준으로 판정한다(상태코드는 무관 — 응답 자체가 중요).
          deadline=$((SECONDS + 180))
          healthy=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(docker inspect -f '{{.State.Running}}' "$NAME" 2>/dev/null)" != "true" ]; then
              echo "ERROR: 새 컨테이너가 기동 중 종료되었습니다." >&2
              break
            fi
            if curl -sS -o /dev/null --max-time 5 http://127.0.0.1:8080/ 2>/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done

          if [ "$healthy" -ne 1 ]; then
            echo "ERROR: 제한 시간 내에 새 컨테이너가 응답하지 않아 롤백합니다." >&2
            docker logs --tail 50 "$NAME" 2>&1 || true
            rollback
            exit 1
          fi

          # 검증 성공 → 이전 컨테이너 정리
          docker rm -f "$PREV" 2>/dev/null || true

          # 디스크 사용량을 제한하기 위해 7일보다 오래된 이미지 정리
          docker image prune -af --filter "until=168h"
          REMOTE

          # 스크립트를 base64로 감싸 SSM 파라미터의 따옴표/개행 이스케이프 문제를 피하고,
          # 인스턴스에서 bash로 실행되도록 한다(RunShellScript 기본 셸 차이 무관, pipefail 보장).
          B64="$(base64 -w0 deploy.sh)"
          printf 'echo %s | base64 -d | bash' "$B64" | jq -Rs '{commands: [.]}' > ssm-params.json

          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "muffin deploy ${TAG:0:12}" \
            --parameters file://ssm-params.json \
            --region "$AWS_REGION" \
            --query "Command.CommandId" --output text)"
          echo "SSM CommandId: $CMD_ID"

          # 완료까지 폴링(최대 15분). 헬스체크로 ~3분 걸릴 수 있어 waiter 기본값보다 길게 잡는다.
          sleep 5
          end=$(( $(date +%s) + 900 ))
          status="Pending"
          while [ "$(date +%s)" -lt "$end" ]; do
            status="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "===== deploy stdout ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" --query "StandardOutputContent" --output text 2>/dev/null || true
          echo "===== deploy stderr ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION" --query "StandardErrorContent" --output text 2>/dev/null || true

          echo "Final SSM status: $status"
          [ "$status" = "Success" ] || exit 1
